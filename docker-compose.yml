# Private dev compose (dev container + the repo mounted). Gitignored: this is
# the developer's local environment, not part of the project repository.
# Variables (ENV_FILE, IMAGE, CONTAINER, PORT, PROJECT_NAME) are set by
# ./build.sh and ./setup.sh; .env only carries the defaults.
services:
  dev:
    build:
      context: .
      args:
        ENV_FILE: ${ENV_FILE}
    image: ${IMAGE}
    container_name: ${CONTAINER}
    ports:
      # Loopback only: SSH into a container that mounts the whole repo.
      - "127.0.0.1:${PORT}:22"
    volumes:
      - .:/home/dev/project
      # Positron Remote SSH unpacks its server binary here (~1.5 GB); a
      # single named volume is shared by every chapter (only one runs at a
      # time). Seeded from the client's matching reh tarball.
      - positron-server:/home/dev/.positron-server

volumes:
  positron-server:
    name: positron-server
    external: true
