# Chapter 8 (example ML microservice): MLflow + FastAPI/Flask + SHAP.
# Requires kubectl + kind/minikube for the cluster-configuration examples.
name: mlewp-chapter08
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.23.5
  - pandas=1.5.3
  - scikit-learn=1.2.2
  - scipy=1.10.1
  - matplotlib=3.7.1
  - mlflow=2.2.2
  - pip:
      - flask==2.2.3
      - fastapi==0.100.0
      - uvicorn==0.23.2
      - gunicorn==20.1.0
      - shap==0.41.0
