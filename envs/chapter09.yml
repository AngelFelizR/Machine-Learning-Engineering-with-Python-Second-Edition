# Chapter 9 (ETML): Apache Airflow + Spark + LLM (LangChain/OpenAI) + boto3.
# Airflow 2.7.0 needs the matching constraints file to resolve cleanly; if the
# pip solve fails, install with:
#   pip install "apache-airflow==2.7.0" --constraint \
#     https://raw.githubusercontent.com/apache/airflow/constraints-2.7.0/constraints-3.10.txt
name: mlewp-chapter09
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.25.2
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - scipy=1.11.2
  - pyspark=3.4.1
  - pip:
      - apache-airflow==2.7.0
      - apache-airflow-providers-apache-spark==4.1.3
      - langchain==0.0.274
      - openai==0.27.9
      - boto3==1.28.35
      - transformers==4.32.0
